[package]
name = "pingcheck"
version = "0.1.1"
edition = "2021"
description = "ICMP liveness probe that pushes status to an Uptime Kuma push monitor"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
surge-ping = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
